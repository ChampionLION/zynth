<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zynth · Atlas style guide</title><style>body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui}header{padding:24px}section{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 16px}iframe{width:100%;height:3300px;border:0;border-radius:12px}a{color:var(--primary)}@media(max-width:700px){section{grid-template-columns:1fr}}</style><style>/* Atlas · canonical UI tokens. RGB compatibility aliases are generated from these. */
